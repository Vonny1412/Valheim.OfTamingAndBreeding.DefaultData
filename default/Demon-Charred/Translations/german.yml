Language: German
Translations:
  OTAB_item_ritual_trophy_charred_twitcher: Erwachender Aschenschädel
  OTAB_item_ritual_trophy_charred_twitcher_description: Eine unheimliche Präsenz verweilt in dem geschwärzten Schädel, als könne sie selbst im Tod keinen Frieden finden.
  OTAB_item_ritual_trophy_charred_melee: Erwachender Aschenblick
  OTAB_item_ritual_trophy_charred_melee_description: Ein unheimliches rotes Leuchten geht von den leeren Augenhöhlen aus und verrät einen Zorn, den selbst der Tod nicht auslöschen konnte.
  OTAB_item_ritual_trophy_charred_archer: Erwachender Aschenschritt
  OTAB_item_ritual_trophy_charred_archer_description: Selbst im Tod scheinen diese versengten Gliedmaßen an eine endlose Jagd gebunden, stets auf der Suche nach ihrer nächsten Beute.
  OTAB_item_ritual_trophy_charred_mage: Erwachender Aschengriff
  OTAB_item_ritual_trophy_charred_mage_description: Die versengten Arme bergen noch immer Überreste jener dunklen Magie, die einst die Flammen ihrem Willen unterwarf.
