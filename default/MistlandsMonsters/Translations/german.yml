Language: German
Translations:
  OTAB_enemy_leveret: Junghase
  OTAB_item_tick_egg: Zecken-Ei
  OTAB_item_tick_egg_description: Ein dickes, gummiartiges Ei eines gezähmten Blutsaugers. Was darin heranwächst, kennt bereits deinen Geruch und wartet nur darauf, als äußerst treuer und wertvoller Begleiter zu schlüpfen.
  OTAB_item_tick_exudate: Zeckensekret
  OTAB_item_tick_exudate_description: Ein streng riechendes, öliges Sekret von Zecken. Sein starker Geruch ist für Gjalls unwiderstehlich.
